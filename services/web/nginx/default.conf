resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;

upstream gateway_service {
    zone gateway_service 64k;
    server gateway:8000 resolve;
    keepalive 16;
}

upstream notifier_service {
    zone notifier_service 64k;
    server notifier:8000 resolve;
    keepalive 8;
}

upstream redirect_service {
    zone redirect_service 64k;
    server redirect:8080 resolve;
    keepalive 64;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    charset utf-8;
    client_max_body_size 16k;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 404 /404.html;
    error_page 502 503 504 /50x.html;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /404.html {
        internal;
    }

    location = /50x.html {
        internal;
    }

    location ^~ /oauth2/ {
        return 404;
    }

    location = /oauth2 {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location = /assets {
        return 404;
    }

    location = /api {
        return 404;
    }

    location = /readyz {
        return 404;
    }

    location ^~ /api/notifications {
        proxy_pass http://notifier_service;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ^~ /api/ {
        proxy_pass http://gateway_service;
    }

    location ~ "^/[0-9A-Za-z]{6}$" {
        proxy_pass http://redirect_service;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
