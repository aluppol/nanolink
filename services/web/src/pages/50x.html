<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Temporarily unavailable · NanoLink</title>
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/svg+xml" href="/assets/{{logo.svg}}">
    <link rel="stylesheet" href="/assets/{{app.css}}">
  </head>
  <body class="error-page">
    <main class="container error-main">
      <img class="error-mark" src="/assets/{{logo.svg}}" alt="" width="48" height="48">
      <h1 class="error-title">Temporarily unavailable</h1>
      <p class="error-text">A NanoLink service is restarting. Try again in a few seconds.</p>
      <a class="button button-primary" href="/">Go to NanoLink</a>
    </main>
  </body>
</html>
