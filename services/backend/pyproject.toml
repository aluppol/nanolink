[project]
name = "nanolink"
version = "1.0.0"
description = "NanoLink write side: API gateway, create-URL worker, notification service and migrations"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.53,<0.54",
    "uvloop>=0.21",
    "httptools>=0.6",
    "pydantic>=2.13,<3",
    "pymongo>=4.18,<5",
    "nats-py>=2.16,<3",
    "redis>=8.1,<9",
    "pyjwt[crypto]>=2.15,<3",
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "mypy>=2.3",
    "pip-audit>=2.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the real MongoDB, NATS and Valkey from dev/compose.test.yaml"]
addopts = "-m 'not integration' --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "PL",
    "FBT", "ERA", "T20", "S", "ASYNC", "RUF", "PERF", "PIE", "PT", "TID", "BLE",
]
ignore = ["PLR2004", "S104", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913", "BLE001", "ARG002"]
"src/nanolink/adapters/oidc/tokens.py" = ["S105"]
"src/nanolink/entrypoints/http_auth.py" = ["S105"]
"src/nanolink/entrypoints/gateway/internal.py" = ["S105"]
"src/nanolink/entrypoints/settings.py" = ["S108"]
"src/nanolink/entrypoints/heartbeat_probe.py" = ["S108"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["nanolink"]
warn_unreachable = true
