server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;

    # Docker's DNS, resolved per request, so a recreated service is found again without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $crud_api http://crud-api:8000;
    set $redirect_api http://redirect-api:3000;

    proxy_set_header Host $host;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /urls {
        proxy_pass $crud_api;
    }

    location /urls/ {
        proxy_pass $crud_api;
    }

    location = /docs {
        proxy_pass $crud_api;
    }

    location = /openapi.json {
        proxy_pass $crud_api;
    }

    location / {
        proxy_pass $redirect_api;
    }
}
